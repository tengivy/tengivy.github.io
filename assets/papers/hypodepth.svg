<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">HypoDepth framework thumbnail</title>
  <desc id="desc">A compact schematic of event-image monocular depth iterative refinement.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5fbff"/>
      <stop offset="1" stop-color="#eef7f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#dff2ff"/>
      <stop offset="1" stop-color="#b8dcff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#e7f8ef"/>
      <stop offset="1" stop-color="#c8ebd4"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#fff1dc"/>
      <stop offset="1" stop-color="#ffd59a"/>
    </linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 Z" fill="#57606a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#24292f" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="900" height="520" rx="28" fill="url(#bg)"/>
  <text x="42" y="64" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#24292f">HypoDepth</text>
  <text x="42" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#57606a">Depth hypothesis guided iterative refinement</text>

  <g filter="url(#shadow)">
    <rect x="46" y="148" width="138" height="82" rx="14" fill="#fff" stroke="#d0d7de"/>
    <text x="115" y="181" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0969da">Image</text>
    <path d="M76 210 L98 190 L117 204 L134 184 L160 210 Z" fill="#b8dcff"/>
    <rect x="46" y="284" width="138" height="82" rx="14" fill="#fff" stroke="#d0d7de"/>
    <text x="115" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#cf222e">Events</text>
    <path d="M75 339 C90 303, 106 351, 121 318 S152 342, 162 309" fill="none" stroke="#cf222e" stroke-width="5"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="250" y="146" width="144" height="222" rx="16" fill="url(#blue)" stroke="#8cbeee"/>
    <text x="322" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24292f">Backbone</text>
    <rect x="280" y="216" width="84" height="32" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="322" y="238" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">1 / 16</text>
    <rect x="280" y="260" width="84" height="32" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="322" y="282" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">1 / 8</text>
    <rect x="280" y="304" width="84" height="32" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="322" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">1 / 4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="466" y="146" width="142" height="222" rx="16" fill="url(#green)" stroke="#9ed5b1"/>
    <text x="537" y="184" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24292f">EIFusion</text>
    <path d="M502 231 h70 M502 276 h70 M502 321 h70" stroke="#1f883d" stroke-width="7" stroke-linecap="round"/>
    <circle cx="505" cy="231" r="10" fill="#fff" stroke="#1f883d"/>
    <circle cx="569" cy="276" r="10" fill="#fff" stroke="#1f883d"/>
    <circle cx="505" cy="321" r="10" fill="#fff" stroke="#1f883d"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="678" y="132" width="176" height="250" rx="16" fill="url(#orange)" stroke="#eac06e"/>
    <text x="766" y="170" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#24292f">Depth Decoder</text>
    <rect x="710" y="202" width="112" height="34" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="766" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">DHV</text>
    <rect x="710" y="250" width="112" height="34" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="766" y="273" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">Cost volume</text>
    <rect x="710" y="298" width="112" height="34" rx="8" fill="#fff" stroke="#d0d7de"/>
    <text x="766" y="321" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">GRU iters</text>
  </g>

  <path d="M184 189 H238" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M184 325 H238" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M394 257 H454" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M608 257 H666" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M766 382 C768 430, 666 438, 666 350" fill="none" stroke="#57606a" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>

  <text x="766" y="434" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#24292f">current iter depth</text>
  <text x="766" y="462" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#57606a">global-to-local residual refinement</text>
</svg>
